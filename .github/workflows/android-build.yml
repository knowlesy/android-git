name: Android CI & Build Artifacts

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Package App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Sign APK (if secrets are configured)
      id: sign_apk
      if: secrets.SIGNING_KEY != '' && secrets.KEY_ALIAS != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_PASSWORD != ''
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/debug
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Upload Signed APK
      if: steps.sign_apk.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: git-sync-app-signed
        path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
        retention-days: 14

    - name: Upload Unsigned Debug APK (Fallback)
      if: steps.sign_apk.outcome != 'success'
      uses: actions/upload-artifact@v4
      with:
        name: git-sync-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
