name: Android CI & Build Artifacts

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    name: Build and Package App
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.SIGNING_KEY != '' && secrets.KEY_ALIAS != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.5.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Sign APK (if secrets are configured)
      id: sign_apk
      if: env.HAS_SECRETS == 'true'
      uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1.0.4
      with:
        releaseDirectory: app/build/outputs/apk/debug
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Upload Signed APK
      if: steps.sign_apk.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
      with:
        name: git-sync-app-signed
        path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
        retention-days: 14

    - name: Upload Unsigned Debug APK (Fallback)
      if: steps.sign_apk.outcome != 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
      with:
        name: git-sync-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

    - name: Create GitHub Release and Upload signed APK
      if: startsWith(github.ref, 'refs/tags/v') && steps.sign_apk.outcome == 'success'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.0.0
      with:
        files: ${{ steps.sign_apk.outputs.signedReleaseFile }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
